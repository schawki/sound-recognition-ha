<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --primary-color:#03a9f4; --primary-background-color:#fafafa; --card-background-color:#fff; --primary-text-color:#212121; --secondary-text-color:#727272; --divider-color:#e0e0e0; --secondary-background-color:#e5e5e5; --text-primary-color:#fff; --success-color:#43a047; --error-color:#db4437; --warning-color:#ffa600; }
  @media (prefers-color-scheme: dark) { :root { --primary-background-color:#111; --card-background-color:#1c1c1c; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --divider-color:#333; --secondary-background-color:#2c2c2c; } }
  body { margin: 0; }
</style></head>
<body>
<script type="module" src="/panel.js"></script>
<script type="module">
  // Stand-in for Home Assistant: answers the WebSocket commands with fixtures and lets the test push live messages.
  const q = new URLSearchParams(location.search);
  const state = window.__state = { fail: q.get("fail"), listeners: [] };
  const sources = [
    { id: "kitchen", name: "Kitchen", type: "rtsp", enabled: true, connected: true, error: null, level_dbfs: -38.2, below_gate: false, active_classes: [], windows: 10, inferences: 10 },
    { id: "garden", name: "Garden camera", type: "go2rtc", enabled: true, connected: true, error: null, level_dbfs: -71, below_gate: true, active_classes: [], windows: 10, inferences: 10 },
    { id: "nursery", name: "Nursery", type: "rtsp", enabled: true, connected: false, error: "starting", level_dbfs: null, below_gate: false, active_classes: [], windows: 0, inferences: 0 },
    { id: "old_pi", name: "Old Pi", type: "alsa_rpi", enabled: false, connected: false, error: null, level_dbfs: null, below_gate: false, active_classes: [], windows: 0, inferences: 0 },
  ];
  const now = Date.now() / 1000;
  const lang = q.get("lang") || "en";
  const fullCatalog = await (await fetch("/catalog_" + (lang === "fr" ? "fr" : "en") + ".json")).json();
  const SMOKE = fullCatalog.classes.find((c) => c.audioset_name === "Smoke detector, smoke alarm").mid;
  state.config = {
    api: { token: "***" }, classes: { Bark: { enabled: true } },
    sources: [
      { id: "kitchen", name: "Kitchen", type: "rtsp", url: "rtsp://x/k", classes: { "Smoke detector, smoke alarm": { enabled: true } }, schedule: { mode: "scheduled", windows: [{ days: ["mon", "tue", "wed", "thu", "fri"], from: "08:00", to: "18:10" }] }, clips: { max_retention_days: 7 } },
      { id: "garden", name: "Garden camera", type: "go2rtc", url: "rtsp://x/g", threshold_offset: 0.1 },
    ],
  };
  state.saves = [];
  const hsLinks = [{ a: "salon", b: "entree", a_name: "Salon", b_name: "Entrée", type: "open_space", sensor: null, state: "open" }, { a: "entree", b: "hall", a_name: "Entrée", b_name: "Entrée (extérieur)", type: "door", sensor: "sensor.hs_porte", state: "closed" }];
  const hs = q.get("hs");
  state.structure = { status: hs === "setup" ? "not_configured" : hs ? "ready" : "not_installed", origin: hs === "ready" ? "home_structure" : "internal", links: hs === "ready" ? hsLinks : [], url: "https://github.com/schawki/ha-home-structure" };
  if (q.get("internal")) state.config.area_links = [{ a: "salon", b: "entree", type: "open" }];
  const TV = fullCatalog.classes.find((c) => c.audioset_name === "Television").mid;
  state.recs = [
    { rule: "enable_contexts", level: "warning", source: "garden", classes: [TV], message: "« Garden camera » (Living room): enable Television.", apply: { source: "garden", class_patch: { [TV]: { enabled: true } } } },
    { rule: "set_environment", level: "info", source: "kitchen", classes: [], message: "Tell the panel what kind of place « Kitchen » is in.", apply: null },
  ];
  sources[1].active_contexts = []; sources[1].ambient_dbfs = -50; sources[1].baseline_dbfs = -60; sources[1].adaptive_enabled = true; sources[1].adaptive_offset = 0;
  const rawAdvice = [
    { rule: "fire_only", kind: "rule", level: "danger", source: "kitchen", classes: [SMOKE], safety: true, message: "Add the beeps class too." },
    { rule: "speech_target", kind: "rule", level: "warning", source: "kitchen", classes: ["/m/09x0r"], safety: false, message: "Speech classes detect conversations." },
    { rule: "speech_target", kind: "rule", level: "warning", source: "garden", classes: ["/m/09x0r"], safety: false, message: "Speech classes detect conversations." },
    { rule: "generic_class", kind: "auto", level: "info", source: "garden", classes: ["/m/05tny_"], safety: false, message: "Bark is generic." },
  ];
  const validate = (cfg) => {
    const errors = [];
    for (const s of cfg.sources || []) if (!s.url) errors.push(`sources(${s.id}): url is required`);
    const warnings = [];
    if (!errors.length) {
      warnings.push({ rule: "schedule_gap_safety", kind: "auto", level: "warning", source: (cfg.sources || []).slice(-1)[0]?.id, classes: [], message: "Gap in the schedule" });
      const smokeOn = (cfg.classes || {})["Smoke detector, smoke alarm"]?.enabled;
      for (const src of cfg.sources || []) for (const mid of ["/m/05tny_", SMOKE, "/m/01b82r"]) warnings.push({ rule: "missing_context", kind: "auto", level: "info", source: src.id, classes: [mid], message: `“${mid}” is sensitive to television, radio or music: add context classes.` });
      if (smokeOn) warnings.push({ rule: "fire_only", kind: "rule", level: "danger", source: "kitchen", classes: [SMOKE], message: "Add the beeps class too" });
    }
    return { errors, warnings };
  };
  const calls = {
    "sound_recognition/overview": () => ({ entry_id: "e", entries: [], version: "0.1.0", language: q.get("lang") || "en", sources,
      warnings: [{ rule: "r", kind: "rule", level: "warning", source: "kitchen", classes: [], message: "m" }], config: JSON.parse(JSON.stringify(state.config)) }),
    "sound_recognition/catalog": () => fullCatalog,
    "sound_recognition/areas": () => ({ areas: [{ area_id: "cuisine", name: "Cuisine" }, { area_id: "entree", name: "Entrée" }, { area_id: "salon", name: "Salon" }] }),
    "sound_recognition/openings": () => ({ openings: [{ entity_id: "binary_sensor.porte_bureau", name: "Porte bureau", area_id: "bureau", state: "off", domain: "binary_sensor", device_class: "door" }, { entity_id: "binary_sensor.porte_cuisine", name: "Porte cuisine", area_id: "cuisine", state: "on", domain: "binary_sensor", device_class: "door" }, { entity_id: "cover.volet_salon", name: "Volet salon", area_id: "salon", state: "open", domain: "cover", device_class: "shutter" }] }),
    "sound_recognition/structure": () => state.structure,
    "sound_recognition/import_structure": () => { state.imports = (state.imports || 0) + 1; return { added: 2 }; },
    "sound_recognition/devices": (m) => {
      const mk = (id, name, area, area_id, extra) => Object.assign({ entity_id: id, name, domain: id.split(".")[0], state: "playing", available: true, has_volume: true, duplicate_of: null, area, area_id }, extra || {});
      const rooms = { salon: [mk("media_player.tv", "TV Salon", "Salon", "salon"), mk("media_player.tv_2", "TV Salon 2", "Salon", "salon", { available: false, state: "unavailable", duplicate_of: "media_player.tv" })], cuisine: [mk("media_player.homepod", "HomePod", "Cuisine", "cuisine")], entree: [] };
      const seen = new Set([m.area_id]);
      for (let i = 0; i < 2; i++) for (const l of (m.links || [])) if (seen.has(l.a) || seen.has(l.b)) { seen.add(l.a); seen.add(l.b); }
      state.deviceCalls = (state.deviceCalls || []).concat([[m.area_id, m.links ? m.links.length : -1]]);
      return { devices: [...seen].sort().flatMap((a) => rooms[a] || []) };
    },
    "sound_recognition/stats": (m) => {
      const hourly = (a) => { const o = new Array(m.hours).fill(0); a.forEach(([i, v]) => { o[o.length - 1 - i] = v; }); return o; };
      return { hours: m.hours, since: 0,
        detections: { total: 7, by_source: { kitchen: 3, garden: 4 }, by_class: [{ source: "garden", mid: "/m/05tny_", class: "Bark", count: 4 }, { source: "kitchen", mid: SMOKE, class: "Smoke", count: 3 }], hourly: hourly([[0, 3], [2, 2], [5, 2]]) },
        masked: { total: 5, by_source: { garden: 5 }, by_class: [], hourly: hourly([[0, 2], [1, 3]]) },
        false: { total: 1, by_source: { garden: 1 }, by_class: [], hourly: hourly([[3, 1]]) } };
    },
    "sound_recognition/recommendations": () => ({ recommendations: state.recs || [] }),
    "sound_recognition/event_feedback": (m) => { state.feedback = (state.feedback || []).concat([[m.event_id, m.false]]); return { ok: true }; },
    "sound_recognition/config": () => JSON.parse(JSON.stringify(state.config)),
    "sound_recognition/config_validate": (m) => validate(m.config),
    "sound_recognition/config_save": (m) => { const v = validate(m.config); if (v.errors.length) throw { code: "invalid_config", message: v.errors.join("; ") }; state.config = m.config; state.saves.push(m.config); return { ok: true }; },
    "sound_recognition/warnings": (m) => ({ warnings: m.overrides === false ? rawAdvice : rawAdvice.filter((w) => {
      const own = ((state.config.sources.find((s) => s.id === w.source) || {}).advice || {})[w.rule];
      const e = own !== undefined ? own : (state.config.advice || {})[w.rule];
      const level = typeof e === "string" ? e : e && e.level; const confirm = e && typeof e === "object" && e.confirm;
      return !(level === "ignore" && (!w.safety || confirm));
    }) }),
    "sound_recognition/go2rtc_streams": (m) => {
      const g = state.go2rtc = state.go2rtc || { url: "", streams: [{ name: "salon", url: "rtsp://192.168.1.5:8554/salon" }, { name: "garage", url: "rtsp://192.168.1.5:8554/garage" }] };
      state.g2calls = (state.g2calls || []).concat([m.url === undefined ? null : m.url]);
      if (m.url !== undefined) {
        if (m.url.includes("down")) throw { code: "go2rtc_unreachable", message: m.url + ": refused" };
        g.url = "http://" + m.url.replace(/^https?:\/\//, "").replace(/:\d+$/, "") + ":1984";
      }
      return g.url ? { configured: true, url: g.url, streams: g.streams } : { configured: false, url: "", streams: [] };
    },
    "sound_recognition/events": () => ({ events: [
      { id: "e1", ts: now - 125, source: "garden", mid: "/m/05tny_", class: "Bark", score: 0.91, clip: "garden/e1.wav", clip_url: "/clip.wav", clip_expires: new Date(Date.now() + 5 * 86400000).toISOString() },
      { id: "e3", ts: now - 900, source: "kitchen", mid: SMOKE, class: "Smoke", score: 0.7, clip: "kitchen/e3.wav", clip_url: "/clip.wav", clip_expires: new Date(Date.now() + 86400000).toISOString() },
      { id: "e2", ts: now - 7200, source: "kitchen", mid: "/m/01b82r", class: "Smoke", score: 0.64, clip: null },
    ] }),
  };
  window.hass = {
    language: q.get("lang") || "en",
    async callWS(msg) {
      if (state.fail === "unreachable") throw { code: "service_error" };
      if (state.fail === "not_loaded") throw { code: "not_loaded" };
      return calls[msg.type](msg);
    },
    connection: { async subscribeMessage(cb) { state.listeners.push(cb); return () => { state.listeners = state.listeners.filter((x) => x !== cb); }; } },
  };
  await customElements.whenDefined("sound-recognition-panel");
  const el = document.createElement("sound-recognition-panel");
  el.hass = window.hass; el.narrow = q.get("narrow") === "1";
  document.body.appendChild(el);
  window.__push = (m) => state.listeners.forEach((cb) => cb(m));
</script></body></html>
