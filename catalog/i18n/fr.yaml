groups:
  dogs:
    name: Chiens
    risk: '« Chien » contient « Aboiement », « Jappement », « Ouaf », « Grondement », « Hurlement de chien ou de
      loup » et « Gémissement de chien » : un aboiement active souvent « Chien » en même temps. « Canidés (chiens,
      loups) » (chiens et loups) ne contient que « Grondement » et « Hurlement de chien ou de loup ».'
    advice: Surveiller « Aboiement » seul. Ajouter « Hurlement de chien ou de loup » seulement si les hurlements
      vous intéressent.
  cats:
    name: Chats
    risk: « Chat » englobe les autres. Les miaulements stridents ressemblent à des pleurs de bébé.
    advice: Choisir « Miaulement » seul ; ne pas combiner avec une alerte « pleurs de bébé » sans règle de confirmation.
  cries_and_screams:
    name: Pleurs et cris aigus
    risk: Sons aigus et plaintifs qui se confondent entre eux (bébé, chat, cri humain, grincement).
    advice: 'Si vous surveillez un bébé : « Pleurs de bébé » avec au moins 2 secondes de détection continue ; ignorez
      les autres.'
  shouts:
    name: Cris et appels
    risk: Les enfants qui jouent, les matchs à la télévision et les films déclenchent souvent ces classes.
    advice: Garder « Hurlements stridents » (et éventuellement « Cri ») avec un seuil élevé ; utiliser « Télévision
      » comme contexte.
  speech:
    name: Parole, voix et contexte vocal
    risk: 'Vie privée : ces classes détectent des conversations. Se confondent avec la télévision et la radio.'
    advice: Ne jamais conserver de clip. Les utiliser comme contexte (« quelqu'un parle ») plutôt que comme alerte.
  sung_voice:
    name: Voix chantée, psalmodie et prière diffusée
    risk: Une voix chantée ou psalmodiée diffusée par haut-parleur (appel à la prière, annonces) active plusieurs
      de ces classes, ainsi que « Parole ».
    advice: Ne pas en faire des alertes. Si ces sons sont fréquents chez vous, relever les seuils des autres classes
      vocales à ces moments.
  detonations:
    name: Détonations et chocs secs
    risk: Pétards, feux d'artifice, portes qui claquent et tonnerre sont facilement pris pour un coup de feu.
    advice: Ne jamais déclencher d'action lourde sur ces classes seules. Utiliser « Feux d'artifice » et « Pétard
      » comme contexte inhibiteur.
  glass_breaking:
    name: Verre et casse
    risk: La vaisselle qui tombe ou s'entrechoque ressemble à un verre brisé.
    advice: Garder « Verre brisé » seul pour la sécurité ; « Casse » et « Fracas » en option. Confirmer avec un
      capteur d'ouverture ou une caméra.
  fire_alarms_and_beeps:
    name: Alarmes incendie et bips d'appareils
    risk: Un bip isolé de micro-ondes ou de lave-linge peut ressembler à un détecteur de fumée.
    advice: 'Pour l''alerte incendie : « Détecteur de fumée » et « Alarme incendie » avec au moins 3 secondes de
      détection soutenue. Ne pas ajouter « Bip » comme alerte.'
  doorbells_and_bells:
    name: Sonnettes, sonneries et cloches
    risk: Les sonneries de téléphone, de télévision et les cloches sont proches d'une sonnette de porte.
    advice: 'Pour la porte : « Sonnette de porte » seul. Les sonneries de téléphone et les cloches restent hors
      alerte.'
  sirens_and_horns:
    name: Sirènes et avertisseurs
    risk: Sons de rue très fréquents, qui se confondent entre eux et avec la télévision.
    advice: Utile seulement comme indicateur extérieur ; ne pas déclencher d'alerte maison.
  whistles:
    name: Sifflets
    risk: Une bouilloire à sifflet, un sifflement de bouche ou une fuite de vapeur sont proches.
    advice: À tester avec votre cuisine avant d'en faire une automatisation.
  doors_and_knocks:
    name: Portes, coups et frappes
    risk: Coups à la porte, tiroirs et meubles se confondent. « Porte » englobe plusieurs sons.
    advice: Choisir « Coups à la porte » pour une visite, « Claquement de porte » pour les claquements ; éviter
      « Porte » et « Tapotement ».
  running_water:
    name: Eau qui coule, fuites
    risk: 'Un robinet, la douche, la pluie et le bruit blanc se ressemblent. Aucune de ces classes ne détecte l''eau
      : seulement son bruit.'
    advice: Toujours accompagner d'une durée et d'un vrai capteur d'eau pour les fuites.
  continuous_motors:
    name: Moteurs et appareils continus
    risk: Bruits continus qui se confondent entre eux et masquent les autres sons.
    advice: 'Les traiter comme contexte : ils indiquent surtout pourquoi les autres classes sont moins sensibles.'
  footsteps_presence:
    name: Pas et présence
    risk: Un capteur de présence fait mieux. Les pas dépendent du revêtement de sol, du micro et des voisins.
    advice: À utiliser en complément d'un capteur de présence, pas à sa place.
  coughs_and_breathing:
    name: Toux, éternuements et respiration
    risk: Sons proches entre eux ; ils relèvent de la santé donc sensibles.
    advice: Ne pas conserver de clip. À réserver à des usages de présence discrète.
  insects_rodents:
    name: Insectes et rongeurs
    risk: Très faibles et très proches de bruits d'appareils ou de tuyauterie.
    advice: Peu fiables ; à n'essayer qu'avec un micro proche (grenier, cave).
  birds:
    name: Oiseaux
    risk: « Oiseau » englobe presque toutes les autres classes de ce groupe.
    advice: Utile seulement comme indicateur d'ambiance extérieure.
  street_vehicles:
    name: Véhicules dans la rue
    risk: Sons de rue omniprésents ; le micro près d'une fenêtre les capte en continu.
    advice: Les utiliser comme contexte extérieur ; ignorer leurs événements.
  fire_crackle:
    name: Feu, crépitement et cuisson
    risk: Le feu, la friture, la pluie et les parasites se ressemblent beaucoup.
    advice: Ne pas utiliser « Feu » comme alerte incendie. Se fier à un vrai détecteur de fumée.
  mic_diagnostics:
    name: Diagnostic de la qualité du micro
    risk: Ces classes ne décrivent pas un événement de la maison, mais l'état du micro et de son câblage.
    advice: 'À surveiller pendant la mise en place : un « Ronflement du secteur (50/60 Hz) » constant, du vent ou
      de la distorsion indiquent un problème matériel.'
  music_general:
    name: Musique
    risk: Une musique de fond active de nombreuses classes (voix, instruments, cloches).
    advice: Garder « Musique » comme contexte ; ignorer instruments et genres.
rules:
  fire_double: '« Détecteur de fumée » et « Alarme incendie » sont très proches : un même événement peut déclencher
    les deux. Utilisez la même action pour les deux et ne comptez qu''une alerte (délai de ré-armement).'
  fire_beeps: '« Bip » se déclenche aussi sur micro-ondes et lave-linge : ne l''utilisez pas comme alerte incendie,
    et exigez une détection soutenue d''au moins 3 secondes pour « Détecteur de fumée ».'
  fire_only: '« Feu » et « Crépitement » se confondent avec la friture et la pluie : ne les utilisez pas comme alerte
    incendie.'
  detonations_fireworks: Feux d'artifice et pétards se confondent avec des coups de feu. Utilisez « Feux d'artifice
    » et « Pétard » en contexte inhibiteur, pas comme événements, et ne déclenchez pas d'action lourde sur « Coup
    de feu » seul.
  doorbell_duplicates: Plusieurs classes de sonnette/cloche se déclenchent en même temps. Gardez « Sonnette de porte
    » comme alerte principale.
  doorbell_phone: Les sonneries de téléphone peuvent déclencher « Sonnette de porte ». Mesurez les confusions chez
    vous avant d'automatiser.
  baby_cat: 'Les miaulements (surtout les cris de chats) sont parfois classés comme pleurs de bébé : exigez une
    détection soutenue d''au moins 2 secondes et un seuil adapté.'
  multiple_shouts: 'Ces classes sont voisines : choisissez-en une comme alerte principale (par exemple « Hurlements
    stridents »). Les autres produiront des alertes en double.'
  glass_duplicates: '« Verre » est le parent de « Verre brisé » : choisissez « Verre brisé » seul, et « Casse »
    ou « Fracas » en option avec un seuil plus élevé.'
  dog_duplicates: '« Chien » contient « Aboiement » (et « Jappement », « Ouaf », « Grondement », « Hurlement de
    chien ou de loup ») : un aboiement déclenche les deux. Gardez « Aboiement ». « Canidés (chiens, loups) » est
    redondant et plus bruyant.'
  speech_target: 'Classes de parole : elles détectent des conversations. Aucun clip ne doit être conservé ; utilisez-les
    seulement comme contexte.'
  water_leak: Ces classes détectent le bruit de l'eau, pas l'eau. Pour une fuite, ajoutez un vrai capteur d'eau
    et une durée minimale (par exemple 5 à 10 minutes).
  music_classes: Quand la musique joue, de nombreuses classes (voix, instruments, cloches) s'activent. Surveillez
    « Musique » comme contexte plutôt que ses sous-classes.
  context_recommended: Ces classes sont sensibles à la télévision et à la radio. Ajoutez « Télévision » et « Radio
    » comme contexte pour relever automatiquement les seuils.
auto_rules:
  parent_child:
    condition: une classe sélectionnée est un ancêtre (ancestors / descendants) d'une autre classe sélectionnée
    message: '« {parent} » contient « {child} » : un même son déclenchera les deux. Gardez la plus précise, ou la
      plus large, mais pas les deux avec des règles différentes (rétention, seuil, action).'
  clip_forbidden:
    condition: clip_retention_days > 0 sur une classe dont clip_forbidden vaut vrai
    message: '« {class} » détecte des conversations : aucun clip ne doit être conservé. La rétention est forcée
      à 0.'
  low_threshold_high_fp:
    condition: seuil inférieur au seuil suggéré sur une classe dont false_positives.level vaut high
    message: « {class} » est souvent déclenchée à tort ; un seuil aussi bas multipliera les fausses alertes. Ajoutez
      un contexte inhibiteur (télévision, radio, musique).
  generic_class:
    condition: role vaut generic
    message: '« {class} » est une classe parente large : préférez ses sous-classes ({examples}).'
  missing_context:
    condition: classe avec inhibiting_contexts non vide, sans aucune classe de contexte sélectionnée
    message: '« {class} » est sensible à la télévision, à la radio ou à la musique : sélectionnez-les comme classes
      de contexte pour relever automatiquement les seuils.'
  schedule_gap_safety:
    condition: la source a un planning avec des trous et une classe de sécurité n'a pas de planning propre
    message: '« {class} » est une classe de sécurité, mais le planning de « {source} » laisse des trous : elle ne
      sera pas écoutée à ces heures. Donnez à la classe son propre planning continu pour qu''elle reste active en
      permanence.'
  volume_gate_safety:
    condition: volume minimum effectif supérieur à -40 dBFS sur une classe de sécurité
    message: 'Le volume minimum de « {source} » ({gate} dBFS) est élevé pour « {class} » : une alarme lointaine
      ou étouffée peut passer sous ce seuil et être manquée. Baissez le seuil de volume ou fixez-en un plus bas
      pour cette classe.'
  clip_source_disallowed:
    condition: clips désactivés sur la source alors que la classe autorise la conservation
    message: 'Les clips sont désactivés sur « {source} » : la conservation de « {class} » y est forcée à 0.'
enum_help:
  interest:
    monitor: classe recommandée comme alerte pour une maison
    optional: classe utile selon votre situation ; à activer en connaissance de cause
    context: 'ne sert pas d''alerte : sert à relever les seuils des autres classes (télévision, musique, parole…)'
    ignore: peu utile ou trop peu fiable pour une maison ; désactivée par défaut
  role:
    event: un événement que l'on peut signaler
    context: décrit l'ambiance (télévision, foule, vent…) plutôt qu'un événement
    diagnostic: indique l'état du micro (ronflement du secteur, vent, distorsion…)
    generic: 'classe parente large : choisir plutôt ses sous-classes'
  sound_type:
    impulsive: bref (verre qui casse, coup à la porte)
    repeated: se répète (pleurs, pas, bips)
    tonal: ton soutenu (sirène, détecteur de fumée, sonnette)
    continuous: dure longtemps (eau qui coule, moteur, pluie)
    variable: durée très variable
  false_positive_level:
    low: rarement déclenchée à tort
    medium: parfois
    high: souvent (télévision, voisinage…)
  privacy:
    normal: pas de souci particulier
    sensitive: peut révéler des informations personnelles ; clips à garder très courts
    confidential: 'conversations : aucun clip ne doit être conservé (clip_interdit = true)'
setting_help:
  threshold: score minimum (0 à 1) à partir duquel la détection compte ; à ajuster, les scores de YAMNet ne sont
    pas calibrés
  min_duration_s: durée minimale de détection soutenue avant de signaler
  cooldown_s: délai avant de pouvoir signaler à nouveau le même son
  pre_roll_s: secondes d'audio conservées avant le déclenchement dans un clip
  post_roll_s: secondes d'audio conservées après le déclenchement
  clip_retention_days: durée de conservation des clips ; 0 = aucun clip
