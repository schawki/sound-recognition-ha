notes:
  speech: 'Parole : aucun clip ne doit être conservé. Utile uniquement comme contexte (« quelqu''un parle ») pour
    relever les seuils des autres classes.'
  child_speech_kid_speaking_shared: 'Mêmes précautions que « Parole » : aucun clip, contexte seulement.'
  speech_synthesizer: Voix de synthèse (assistant vocal, annonces). Peut servir à ignorer les sons produits par
    vos propres assistants.
  shout: 'Cri : classe parente de « Appel crié », « Cri de joie », « Beuglement (voix) » et « Enfants qui crient
    ». Choisir « Hurlements stridents » comme alerte principale, et ne garder « Cri » qu''en option.'
  yell: 'Appel crié : sous-classe de « Cri ». Doublon si « Cri » est choisi ; très sensible à la télévision et aux
    enfants.'
  children_shouting: Presque toujours un son normal. Peu utile pour une alerte.
  screaming: 'Cris stridents : le plus utile pour la sécurité mais aussi le plus sujet aux fausses alertes (films,
    jeux, enfants qui s''amusent). À confirmer par un second signal (présence, porte, caméra) avant toute action.'
  whispering: 'Chuchotement : confidentiel, très peu fiable. Ne pas conserver de clip.'
  laughter_shared: Pas d'intérêt pour une alerte ; sensible côté vie privée.
  crying_sobbing: Pleurs d'enfant ou d'adulte. Redondant avec « Pleurs de bébé » pour surveiller un enfant en bas
    âge.
  baby_cry_infant_cry: 'Pleurs de bébé : cas d''usage très demandé. Se confond parfois avec les miaulements (voir
    « Pleurs et cris aigus »). Exiger au moins 2 secondes de détection continue réduit les fausses alertes.'
  whimper: 'Gémissement plaintif : proche des pleurs faibles et de « Gémissement de chien ». Très flou.'
  wail_moan: 'Lamentation, gémissement : intéressant en théorie pour une détresse, mais trop peu fiable pour déclencher
    seul une alerte.'
  singing: 'Chant : intéressant surtout comme contexte (activité musicale). Une voix chantée diffusée par haut-parleur
    (appel à la prière, annonces) peut aussi le déclencher.'
  chant: '« Psalmodie » : une psalmodie ou un appel à la prière diffusé à l''extérieur peut déclencher cette classe,
    ainsi que « Parole » et « Musique du Moyen-Orient ».'
  groan: Gémissement sourd. À ne pas utiliser seul pour une détection de chute ou de détresse.
  whistling: 'Sifflement de la bouche. Proche du sifflet (bouilloire, sifflet à vapeur) : voir « Sifflets ».'
  snoring: 'Ronflement : indique qu''une personne dort dans la pièce ; sensible, ne pas conserver de clip.'
  cough: 'Toux : donnée de santé potentielle, donc sensible. Ne pas conserver de clip.'
  run_shared: 'Pas : complète un capteur de présence mais ne le remplace pas ; dépend beaucoup du revêtement et
    du micro.'
  finger_snapping: Peut servir de commande sans voix (claquement de doigts), à tester.
  clapping: 'Claquements de mains : peut servir de commande sans voix. Confusion avec les applaudissements et certains
    chocs secs.'
  heart_sounds_heartbeat_shared: 'Peu pertinent en pratique : se confond avec des basses ou des battements.'
  crowd: 'Foule : souvent la télévision ou la rue. À utiliser seulement comme contexte.'
  hubbub_speech_noise_speech_babble: 'Brouhaha : plusieurs voix en même temps. Contexte seulement.'
  children_playing: 'Enfants qui jouent : normal dans la plupart des cas. Peut servir à calmer d''autres classes
    (cris).'
  animal: 'Classe racine : à ne pas choisir directement.'
  domestic_animals_pets: 'Classe parente : ne pas choisir seule.'
  dog: 'Classe parente : englobe aboiement, hurlement, grondement, etc. Choisir plutôt les classes précises.'
  bark: 'Aboiement : la classe la plus utile pour les chiens. Préférer « Aboiement » seul plutôt que « Chien » +
    « Aboiement » (doublon).'
  yip_shared: 'Sous-classe de « Chien » : redondant si « Aboiement » est déjà surveillé.'
  cat: 'Classe parente : englobe miaulement, ronronnement, feulement.'
  meow: 'Miaulement : se confond parfois avec des pleurs de bébé.'
  hiss: 'Feulement : proche d''un jet d''air ou de vapeur (« Vapeur », « Pulvérisation »).'
  caterwaul: 'Miaulements de bagarre : forts, proches de cris ou de pleurs.'
  livestock_farm_animals_working_animals: Classe parente.
  crowing_cock_a_doodle_doo: 'Chant du coq : utile seulement si vous en élevez ; sinon source de bruit extérieur.'
  wild_animals: 'Classe parente : à ne pas choisir directement.'
  bird: 'Oiseaux en général : sert d''indicateur d''ambiance extérieure (micro proche d''une fenêtre ouverte).'
  canidae_dogs_wolves: 'Classe regroupant chiens et loups : ne contient que « Grondement » et « Hurlement de chien
    ou de loup » (pas « Aboiement »). Redondante avec « Chien » et plus bruyante.'
  mouse: 'Souris : possible en grenier ou cave, mais très flou ; à tester avant d''en tirer une alerte.'
  patter: 'Trottinement : confusion fréquente avec la pluie fine ou des pas légers.'
  insect_shared: 'Insectes : peu fiable en intérieur ; se confond avec des bourdonnements d''appareils.'
  whale_vocalization: Sans intérêt domestique ; déclenche surtout sur des sons tonals graves.
  music: 'Classe la plus utile du groupe musique : un seul signal « de la musique joue » pour relever les seuils
    des autres classes. Les 140+ autres classes musicales (instruments, genres) sont ignorées par défaut.'
  bell: Classe parente des cloches (église, vélo, grelot, carillon, diapason, cloche de vache). Ne contient pas
    « Sonnette de porte » mais s'en approche à l'oreille.
  church_bell: 'Cloche d''église : sons extérieurs ; proche d''une sonnette selon le micro.'
  middle_eastern_music: Peut se déclencher sur un appel à la prière ou une psalmodie diffusés par haut-parleur.
  lullaby: 'Berceuse : sans intérêt pour la détection ; fait partie de l''ensemble « Musique ».'
  wind: 'Vent : sert à relativiser les autres détections extérieures.'
  wind_noise_microphone: 'Vent dans le micro : indique que le micro est exposé à un courant d''air (fenêtre ouverte,
    ventilation). À utiliser pour déplacer le micro.'
  thunderstorm: 'Orage : peut servir à des automatisations (fermer les stores, protéger du matériel). Se confond
    avec de lourds travaux.'
  thunder: 'Tonnerre : se confond avec des détonations sourdes.'
  water: 'Classe parente de l''eau : ne pas choisir directement.'
  rain_shared: 'Pluie : utile comme contexte (fenêtre restée ouverte, linge dehors) et pour relever les seuils des
    autres classes. Confusion avec bruit blanc et friture.'
  steam: 'Vapeur : se confond avec les jets d''air et le bruit blanc.'
  fire: 'Feu : à ne PAS utiliser comme alerte incendie fiable (crépitement très proche d''une friture ou d''une
    pluie). Réserver au contexte.'
  crackle: 'Crépitement : se confond avec la pluie, la friture et les parasites.'
  vehicle: 'Classe racine des véhicules : à ne pas choisir.'
  vehicle_horn_car_horn_honking_shared: 'Klaxons : sons de rue, sans intérêt pour la maison.'
  car_alarm: 'Alarme de voiture : utile seulement si le véhicule est à portée d''écoute. Se répète dans la rue,
    donc beaucoup d''alertes sans importance.'
  reversing_beeps: 'Bip de recul : se confond avec d''autres bips.'
  traffic_noise_roadway_noise: 'Circulation : indique l''ambiance extérieure ; utile pour relever les seuils près
    d''une fenêtre.'
  engine: 'Classe parente des moteurs : très large.'
  engine_starting: 'Démarrage moteur : possible pour un garage ou une voiture proche (arrivée, départ).'
  idling: 'Moteur au ralenti : par exemple une voiture qui tourne dans un garage fermé. Détecte le bruit, pas le
    monoxyde.'
  door: 'Classe parente de « Sonnette de porte », « Coups à la porte », « Claquement de porte » : à ne pas choisir
    en même temps que ses enfants.'
  doorbell: 'Sonnette de porte : utile pour notifier et pour déclencher une caméra. Les sonnettes électroniques
    à mélodie sont mieux détectées que les simples bips.'
  ding_dong: 'Sous-classe de « Sonnette de porte » : doublon si celle-ci est déjà surveillée. Utile en complément
    pour les sonnettes à deux tons.'
  slam: 'Claquement de porte : confusion avec détonations (pétards) et chutes d''objets.'
  knock: 'Coups à la porte : utile pour notifier une visite quand la sonnette est absente ou en panne.'
  tap: 'Tapotement : trop général (clavier, doigts, table).'
  microwave_oven: 'Micro-ondes (surtout ses bips de fin). Source de FAUSSES alertes sur « Détecteur de fumée » :
    voir les règles de combinaison.'
  water_tap_faucet_shared: 'Eau qui coule : à relier à une durée (robinet resté ouvert). Se confond avec la douche
    et le bruit blanc.'
  toilet_flush: 'Chasse d''eau : une chasse qui coule en continu est détectable avec une durée.'
  vacuum_cleaner: 'Aspirateur : très reconnaissable. Utile pour ignorer les autres détections pendant le ménage.'
  keys_jangling: 'Cliquetis de clés : indice d''arrivée à la porte, mais peu fiable seul.'
  typing: 'Frappe au clavier : indique une présence ; sensible.'
  alarm: 'Classe parente de presque tous les signaux d''alarme : très large, donc très bruyante. Préférer les classes
    précises.'
  telephone: Classe parente de toutes les sonneries de téléphone.
  telephone_bell_ringing: Sonnerie de téléphone fixe. Confusion avec la sonnette de porte.
  ringtone: 'Sonnerie de mobile : intéressant pour retrouver un téléphone ou savoir qu''il sonne seul, mais très
    variable (mélodies).'
  alarm_clock: 'Réveil qui sonne : peut servir à vérifier qu''un réveil a bien sonné ; se confond avec d''autres
    bips.'
  siren: 'Sirène en général : classe parente des sirènes de véhicules. Surtout un indicateur de ce qui se passe
    dans la rue.'
  buzzer: 'Buzzer : interphone, ouverture de porte d''immeuble, minuteries. Très proche des bips d''appareils.'
  smoke_detector_smoke_alarm: 'Le cas d''usage le plus utile. Exiger une détection soutenue d''au moins 3 secondes
    : un bip isolé ne doit pas déclencher. Ce n''est PAS un remplacement d''un vrai détecteur de fumée : c''est
    une redondance qui entend un détecteur existant.'
  fire_alarm: 'Alarme incendie (sirène d''immeuble par exemple). Proche de « Détecteur de fumée » : en choisir un
    seul comme alerte principale, l''autre en confirmation.'
  whistle: 'Sifflet : peut détecter une bouilloire à sifflet, mais se confond avec un sifflement de bouche.'
  steam_whistle: 'Sifflet à vapeur : bouilloire ou cocotte-minute. À tester.'
  air_conditioning: 'Climatisation : bruit continu. Sert surtout à comprendre pourquoi un micro capte du bruit de
    fond constant.'
  hammer_shared: 'Outils et travaux : plutôt des bruits de voisinage que des événements utiles.'
  explosion: 'Explosion : classe parente large de détonations. Bruyante et peu spécifique.'
  gunshot_gunfire: 'Coup de feu : ne jamais déclencher d''action automatique lourde sur cette seule classe. Dans
    les régions où les pétards ou les feux d''artifice sont courants, attendre beaucoup de fausses alertes.'
  fireworks: 'Feux d''artifice : à utiliser comme contexte pour relever les seuils de « Coup de feu », « Explosion
    » et « Éclatement » pendant les fêtes.'
  firecracker: 'Pétard : idem « Feux d''artifice » ; confusion fréquente avec un coup de feu.'
  glass: 'Classe parente de « Verre brisé » et « Tintement de verre » : choisir plutôt « Verre brisé ».'
  chink_clink: 'Tintement de verre : repas, verres qui s''entrechoquent. Très fréquent, peu utile.'
  shatter: 'Verre brisé : utile pour la sécurité (vitre cassée). À confirmer avec un capteur de fenêtre ou une caméra
    : les chutes de vaisselle sont fréquentes.'
  liquid: 'Classe parente large : ne pas choisir directement.'
  drip: 'Goutte à goutte : peut signaler un robinet ou une fuite, à condition d''avoir un micro proche et un environnement
    calme.'
  gush: 'Jaillissement : possible indice d''une fuite importante. Détecte le bruit, pas la fuite : à doubler d''un
    capteur d''eau.'
  fill_with_liquid: 'Remplissage : utile pour une baignoire ou un seau qui se remplit. Combiner avec une durée (par
    exemple plus de 10 minutes).'
  boiling: 'Ébullition : peut signaler une casserole ou une bouilloire qui bout. Ne remplace pas une sécurité cuisinière.'
  thump_thud: 'Bruit sourd : chute d''un objet ou d''une personne, meubles, voisins. Ne pas utiliser seul pour une
    détection de chute.'
  breaking: 'Casse en général (pas seulement du verre) : plus large, donc plus de fausses alertes.'
  beep_bleep: Bips d'appareils (fin de cycle). Très répandus, donc à regrouper avec « Four à micro-ondes » ; ne
    pas en faire une alerte incendie.
  ding: 'Ding : se confond avec la sonnette de porte et les minuteurs.'
  clatter: Fracas d'objets qui tombent ou s'entrechoquent.
  sizzle: 'Grésillement : cuisson à la poêle. Détecte un bruit de cuisson, pas un danger.'
  silence: 'Silence : si cette classe est constante alors qu''il y a de l''activité, le micro est probablement muet
    ou mal branché.'
  inside_small_room_shared: 'Décrit l''acoustique du lieu (pièce, extérieur) plutôt qu''un événement : utile seulement
    pour comprendre l''environnement du micro.'
  static_shared: 'Indicateur de qualité du micro : une valeur élevée en continu signale souvent un micro bruyant
    ou saturé.'
  mains_hum: 'Ronflement du secteur (50/60 Hz) : s''il est élevé en permanence, le micro capte un bruit électrique
    (alimentation, boucle de masse). À corriger côté câblage.'
  television: La télévision est la première cause de fausses alertes. Comme classe de CONTEXTE, elle permet de relever
    les seuils de cris, coups de feu, aboiements et sonnettes quand elle tourne.
  radio: 'Même usage que « Télévision » : signale qu''un son vient d''un haut-parleur, pas de la pièce.'
