groups:
  dogs:
    name: Dogs
    risk: '“Dog” contains “Bark”, “Yip”, “Bow-wow”, “Growling”, “Howl” and “Dog whimper”: a bark often activates
      “Dog” at the same time. “Canids (dogs, wolves)” contains only “Growling” and “Howl”.'
    advice: Monitor “Bark” alone. Add “Howl” only if howling interests you.
  cats:
    name: Cats
    risk: “Cat” includes the others. Shrill meows resemble a baby crying.
    advice: Choose “Meow” alone; do not combine it with a baby-cry alert without a confirmation rule.
  cries_and_screams:
    name: Cries and screams
    risk: High-pitched, plaintive sounds that get confused with each other (baby, cat, human scream, squeal).
    advice: 'If you watch a baby: “Baby cry” with at least 2 seconds of continuous detection; ignore the others.'
  shouts:
    name: Shouts and calls
    risk: Playing children, TV matches and films often trigger these classes.
    advice: Keep “Screaming” (and possibly “Shout”) with a high threshold; use “Television” as context.
  speech:
    name: Speech, voices and vocal context
    risk: 'Privacy: these classes detect conversations. They get confused with television and radio.'
    advice: Never keep a clip. Use them as context (“someone is talking”) rather than as an alert.
  sung_voice:
    name: Sung voice, chant and broadcast prayer
    risk: A sung or chanted voice broadcast by a loudspeaker (call to prayer, announcements) activates several of
      these classes, as well as “Speech”.
    advice: Do not make them alerts. If these sounds are frequent where you live, raise the thresholds of the other
      vocal classes at those times.
  detonations:
    name: Detonations and sharp impacts
    risk: Firecrackers, fireworks, slamming doors and thunder are easily mistaken for a gunshot.
    advice: Never trigger a heavy action on these classes alone. Use “Fireworks” and “Firecracker” as inhibiting
      context.
  glass_breaking:
    name: Glass and breaking
    risk: Dropped or clinking dishes resemble breaking glass.
    advice: Keep “Shattering glass” alone for security; “Breaking” and “Clatter” as options. Confirm with an opening
      sensor or a camera.
  fire_alarms_and_beeps:
    name: Fire alarms and appliance beeps
    risk: An isolated beep from a microwave or washing machine can resemble a smoke detector.
    advice: 'For the fire alert: “Smoke detector” and “Fire alarm” with at least 3 seconds of sustained detection.
      Do not add “Beep” as an alert.'
  doorbells_and_bells:
    name: Doorbells, ringtones and bells
    risk: Telephone rings, television rings and bells are close to a doorbell.
    advice: 'For the door: “Doorbell” alone. Telephone rings and bells stay out of alerts.'
  sirens_and_horns:
    name: Sirens and horns
    risk: Very frequent street sounds, confused with each other and with television.
    advice: Useful only as an outdoor indicator; do not trigger a home alert.
  whistles:
    name: Whistles
    risk: A whistling kettle, mouth whistling and a steam leak are close.
    advice: Test with your kitchen before building an automation.
  doors_and_knocks:
    name: Doors, knocks and bangs
    risk: Knocks, drawers and furniture get confused. “Door” includes several sounds.
    advice: Choose “Knock” for a visit, “Slam” for slamming; avoid “Door” and “Tap”.
  running_water:
    name: Running water, leaks
    risk: 'A tap, the shower, rain and white noise sound alike. None of these classes detects water: only its noise.'
    advice: Always pair with a duration and a real water sensor for leaks.
  continuous_motors:
    name: Motors and continuous appliances
    risk: Continuous noises that get confused with each other and mask other sounds.
    advice: 'Treat them as context: they mostly explain why other classes are less sensitive.'
  footsteps_presence:
    name: Footsteps and presence
    risk: A presence sensor does better. Footsteps depend on the floor, the microphone and the neighbours.
    advice: Use as a complement to a presence sensor, not instead of it.
  coughs_and_breathing:
    name: Coughs, sneezes and breathing
    risk: Sounds close to each other; they relate to health, therefore sensitive.
    advice: Do not keep clips. Reserve for discreet presence uses.
  insects_rodents:
    name: Insects and rodents
    risk: Very faint and very close to appliance or plumbing noises.
    advice: Unreliable; try only with a nearby microphone (attic, cellar).
  birds:
    name: Birds
    risk: “Bird” includes almost all the other classes of this group.
    advice: Useful only as an indicator of outdoor ambience.
  street_vehicles:
    name: Vehicles in the street
    risk: Omnipresent street sounds; a microphone near a window picks them up continuously.
    advice: Use them as outdoor context; ignore their events.
  fire_crackle:
    name: Fire, crackle and cooking
    risk: Fire, frying, rain and static sound very much alike.
    advice: Do not use “Fire” as a fire alert. Rely on a real smoke detector.
  mic_diagnostics:
    name: Microphone quality diagnostics
    risk: These classes do not describe an event in the house but the state of the microphone and its wiring.
    advice: 'Watch them during setup: a constant “Mains hum”, wind or distortion points to a hardware problem.'
  music_general:
    name: Music
    risk: Background music activates many classes (voices, instruments, bells).
    advice: Keep “Music” as context; ignore instruments and genres.
rules:
  fire_double: '“Smoke detector” and “Fire alarm” are very close: one event can trigger both. Use the same action
    for both and count a single alert (cooldown).'
  fire_beeps: '“Beep” also triggers on microwave ovens and washing machines: do not use it as a fire alert, and
    require sustained detection of at least 3 seconds for “Smoke detector”.'
  fire_only: '“Fire” and “Crackle” get confused with frying and rain: do not use them as a fire alert.'
  detonations_fireworks: Fireworks and firecrackers get confused with gunshots. Use “Fireworks” and “Firecracker”
    as inhibiting context, not as events, and do not trigger a heavy action on “Gunshot” alone.
  doorbell_duplicates: Several doorbell/bell classes trigger at the same time. Keep “Doorbell” as the main alert.
  doorbell_phone: Telephone rings can trigger “Doorbell”. Measure the confusions at home before automating.
  baby_cat: 'Meows (especially cat cries) are sometimes classified as a baby cry: require sustained detection of
    at least 2 seconds and a suitable threshold.'
  multiple_shouts: 'These classes are neighbours: choose one as the main alert (for example “Screaming”). The others
    will produce duplicate alerts.'
  glass_duplicates: '“Glass” is the parent of “Shattering glass”: choose “Shattering glass” alone, and “Breaking”
    or “Smash or crash” as an option with a higher threshold.'
  dog_duplicates: '“Dog” contains “Bark” (and “Yip”, “Bow-wow”, “Growling”, “Howl”): a bark triggers both. Keep
    “Bark”. “Canids (dogs, wolves)” is redundant and noisier.'
  speech_target: 'Speech classes: they detect conversations. No clip must be kept; use them only as context.'
  water_leak: These classes detect the noise of water, not water. For a leak, add a real water sensor and a minimum
    duration (for example 5 to 10 minutes).
  music_classes: When music plays, many classes (voices, instruments, bells) activate. Monitor “Music” as context
    rather than its sub-classes.
  context_recommended: These classes are sensitive to television and radio. Add “Television” and “Radio” as context
    to raise the thresholds automatically.
auto_rules:
  parent_child:
    condition: a selected class is an ancestor (ancestors / descendants) of another selected class
    message: '“{parent}” contains “{child}”: one sound will trigger both. Keep the more precise one, or the broader
      one, but not both with different rules (retention, threshold, action).'
  clip_forbidden:
    condition: clip_retention_days > 0 on a class whose clip_forbidden is true
    message: '“{class}” detects conversations: no clip may be kept. Retention is forced to 0.'
  low_threshold_high_fp:
    condition: threshold below the suggested threshold on a class whose false_positives.level is high
    message: “{class}” is often triggered by mistake; a threshold this low will multiply false alerts. Add an inhibiting
      context (television, radio, music).
  generic_class:
    condition: role is generic
    message: '“{class}” is a broad parent class: prefer its sub-classes ({examples}).'
  missing_context:
    condition: class with non-empty inhibiting_contexts and no context class selected
    message: '“{class}” is sensitive to television, radio or music: select them as context classes to raise the
      thresholds automatically.'
  schedule_gap_safety:
    condition: the source has a schedule with gaps and a safety class has no schedule of its own
    message: '“{class}” is a safety class, but the schedule of “{source}” leaves gaps: it will not be listened for
      during those hours. Give the class its own continuous schedule to keep it active at all times.'
  volume_gate_safety:
    condition: effective minimum volume above -40 dBFS on a safety class
    message: 'The minimum volume of “{source}” ({gate} dBFS) is high for “{class}”: a distant or muffled alarm may
      fall below it and be missed. Lower the gate or set a lower one for this class.'
  clip_source_disallowed:
    condition: clips disabled on the source while the class allows retention
    message: 'Clips are disabled on “{source}”: the retention of “{class}” is forced to 0 there.'
enum_help:
  interest:
    monitor: class recommended as an alert for a home
    optional: useful depending on your situation; enable it knowingly
    context: 'not an alert: used to raise the thresholds of other classes (television, music, speech…)'
    ignore: of little use or too unreliable for a home; disabled by default
  role:
    event: an event you can report
    context: describes the ambience (television, crowd, wind…) rather than an event
    diagnostic: indicates the state of the microphone (mains hum, wind, distortion…)
    generic: 'broad parent class: choose its sub-classes instead'
  sound_type:
    impulsive: short (breaking glass, a knock)
    repeated: repeats (crying, footsteps, beeps)
    tonal: sustained tone (siren, smoke detector, doorbell)
    continuous: lasts a long time (running water, engine, rain)
    variable: very variable duration
  false_positive_level:
    low: rarely triggered by mistake
    medium: sometimes
    high: often (television, neighbours…)
  privacy:
    normal: no particular concern
    sensitive: may reveal personal information; keep clips very short
    confidential: 'conversations: no clip may be kept (clip_forbidden = true)'
setting_help:
  threshold: minimum score (0 to 1) for a detection to count; to be tuned, YAMNet scores are not calibrated
  min_duration_s: minimum duration of sustained detection before reporting
  cooldown_s: delay before the same sound can be reported again
  pre_roll_s: seconds of audio kept before the trigger in a clip
  post_roll_s: seconds of audio kept after the trigger
  clip_retention_days: how long clips are kept; 0 = no clip
