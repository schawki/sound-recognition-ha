notes:
  speech: 'Speech: no clip must be kept. Useful only as context (“someone is talking”) to raise the thresholds of
    other classes.'
  child_speech_kid_speaking_shared: 'Same precautions as “Speech”: no clip, context only.'
  speech_synthesizer: Synthetic voice (voice assistant, announcements). Can be used to ignore sounds produced by
    your own assistants.
  shout: 'Shout: parent class of “Yell”, “Whoop”, “Bellow” and “Children shouting”. Choose “Screaming” as the main
    alert and keep “Shout” as an option only.'
  yell: 'Yell: sub-class of “Shout”. Duplicate if “Shout” is selected; very sensitive to television and children.'
  children_shouting: Almost always a normal sound. Of little use for an alert.
  screaming: 'Screams: the most useful class for security but also the most prone to false alerts (films, games,
    playing children). Confirm with a second signal (presence, door, camera) before any action.'
  whispering: 'Whispering: confidential and very unreliable. Do not keep clips.'
  laughter_shared: Of no use for an alert; sensitive for privacy.
  crying_sobbing: Crying of a child or an adult. Redundant with “Baby cry” when watching an infant.
  baby_cry_infant_cry: 'Baby cry: a very common use case. Sometimes confused with cat meows (see “Cries and screams”).
    Requiring at least 2 seconds of continuous detection reduces false alerts.'
  whimper: 'Whimper: close to weak crying and to “Dog whimper”. Very vague.'
  wail_moan: 'Wail or moan: interesting in theory for distress, but too unreliable to trigger an alert on its own.'
  singing: 'Singing: mostly useful as context (musical activity). A sung voice played through a loudspeaker (call
    to prayer, announcements) can also trigger it.'
  chant: '“Chant”: a chant or a call to prayer broadcast outdoors can trigger this class, as well as “Speech” and
    “Middle Eastern music”.'
  groan: Groan. Do not use alone for fall or distress detection.
  whistling: 'Whistling with the mouth. Close to a whistle (kettle, steam whistle): see “Whistles”.'
  snoring: 'Snoring: indicates that someone is sleeping in the room; sensitive, do not keep clips.'
  cough: 'Cough: potential health data, therefore sensitive. Do not keep clips.'
  run_shared: 'Footsteps: complement a presence sensor but do not replace it; depends heavily on the floor covering
    and the microphone.'
  finger_snapping: Can be used as a voiceless command (finger snap); to be tested.
  clapping: 'Hand claps: can be used as a voiceless command. Confused with applause and some sharp impacts.'
  heart_sounds_heartbeat_shared: 'Not relevant in practice: confused with bass sounds or thumping.'
  crowd: 'Crowd: often the television or the street. Use only as context.'
  hubbub_speech_noise_speech_babble: 'Crowd chatter: several voices at once. Context only.'
  children_playing: 'Children playing: normal in most cases. Can be used to calm other classes (screams).'
  animal: 'Root class: do not select directly.'
  domestic_animals_pets: 'Parent class: do not select alone.'
  dog: 'Parent class: includes barking, howling, growling, etc. Choose the specific classes instead.'
  bark: 'Bark: the most useful class for dogs. Prefer “Bark” alone rather than “Dog” + “Bark” (duplicate).'
  yip_shared: 'Sub-class of “Dog”: redundant if “Bark” is already monitored.'
  cat: 'Parent class: includes meowing, purring, hissing.'
  meow: 'Meow: sometimes confused with a baby cry.'
  hiss: 'Hiss: close to a jet of air or steam (“Steam”, “Spray”).'
  caterwaul: 'Fighting cat cries: loud, close to screams or crying.'
  livestock_farm_animals_working_animals: Parent class.
  crowing_cock_a_doodle_doo: 'Rooster crow: useful only if you keep roosters; otherwise a source of outdoor noise.'
  wild_animals: 'Parent class: do not select directly.'
  bird: 'Birds in general: acts as an indicator of outdoor ambience (microphone near an open window).'
  canidae_dogs_wolves: 'Class covering dogs and wolves: contains only “Growling” and “Howl” (not “Bark”). Redundant
    with “Dog” and noisier.'
  mouse: 'Mouse: possible in an attic or cellar, but very vague; test before building an alert on it.'
  patter: 'Patter: often confused with light rain or light footsteps.'
  insect_shared: 'Insects: unreliable indoors; confused with the humming of appliances.'
  whale_vocalization: No domestic interest; mostly triggers on low tonal sounds.
  music: 'The most useful class of the music group: a single “music is playing” signal to raise the thresholds of
    other classes. The 140+ other music classes (instruments, genres) are ignored by default.'
  bell: Parent class of bells (church, bicycle, sleigh bell, chime, tuning fork, cow bell). Does not contain “Doorbell”
    but sounds close to it.
  church_bell: 'Church bell: outdoor sound; close to a doorbell depending on the microphone.'
  middle_eastern_music: Can trigger on a call to prayer or a chant broadcast by loudspeaker.
  lullaby: 'Lullaby: of no use for detection; part of the “Music” set.'
  wind: 'Wind: used to put other outdoor detections into perspective.'
  wind_noise_microphone: 'Wind in the microphone: indicates that the microphone is exposed to a draught (open window,
    ventilation). Use it to decide where to move the microphone.'
  thunderstorm: 'Thunderstorm: can drive automations (close shutters, protect equipment). Confused with heavy construction
    work.'
  thunder: 'Thunder: confused with muffled gunshots.'
  water: 'Parent class of water: do not select directly.'
  rain_shared: 'Rain: useful as context (window left open, laundry outside) and to raise the thresholds of other
    classes. Confused with white noise and frying.'
  steam: 'Steam: confused with air jets and white noise.'
  fire: 'Fire: do NOT use as a reliable fire alert (crackling is very close to frying or rain). Keep for context.'
  crackle: 'Crackle: confused with rain, frying and static.'
  vehicle: 'Root class of vehicles: do not select.'
  vehicle_horn_car_horn_honking_shared: 'Horns: street sounds, of no interest for the home.'
  car_alarm: 'Car alarm: useful only if the vehicle is within earshot. Repeats in the street, hence many unimportant
    alerts.'
  reversing_beeps: 'Reversing beeps: confused with other beeps.'
  traffic_noise_roadway_noise: 'Traffic: indicates the outdoor ambience; useful to raise thresholds near a window.'
  engine: 'Parent class of engines: very broad.'
  engine_starting: 'Engine starting: possible for a garage or a nearby car (arrival, departure).'
  idling: 'Idling engine: for example a car running in a closed garage. Detects the noise, not carbon monoxide.'
  door: 'Parent class of “Doorbell”, “Knock”, “Slam”: do not select together with its children.'
  doorbell: 'Doorbell: useful to notify and to trigger a camera. Electronic melody doorbells are detected better
    than simple beeps.'
  ding_dong: 'Sub-class of “Doorbell”: duplicate if it is already monitored. Useful as a complement for two-tone
    doorbells.'
  slam: 'Door slam: confused with gunshots (firecrackers) and falling objects.'
  knock: 'Knock: useful to notify a visit when the doorbell is missing or broken.'
  tap: 'Tap: too general (keyboard, fingers, table).'
  microwave_oven: 'Microwave oven (mostly its end-of-cycle beeps). Source of FALSE alerts on “Smoke detector”: see
    the combination rules.'
  water_tap_faucet_shared: 'Running water: link it to a duration (tap left open). Confused with the shower and white
    noise.'
  toilet_flush: 'Toilet flush: a flush that runs continuously can be detected with a duration.'
  vacuum_cleaner: 'Vacuum cleaner: very recognizable. Useful to ignore other detections during cleaning.'
  keys_jangling: 'Keys jangling: a hint of arrival at the door, but unreliable alone.'
  typing: 'Typing: indicates presence; sensitive.'
  alarm: 'Parent class of almost all alarm signals: very broad, therefore very noisy. Prefer the specific classes.'
  telephone: Parent class of all telephone ring sounds.
  telephone_bell_ringing: Landline telephone ring. Confused with the doorbell.
  ringtone: 'Mobile ringtone: interesting to find a phone or to know it is ringing alone, but very variable (melodies).'
  alarm_clock: 'Alarm clock ringing: can be used to check that an alarm clock did ring; confused with other beeps.'
  siren: 'Siren in general: parent class of vehicle sirens. Mostly an indicator of what is happening in the street.'
  buzzer: 'Buzzer: intercom, building door release, timers. Very close to appliance beeps.'
  smoke_detector_smoke_alarm: 'The most useful use case. Require sustained detection of at least 3 seconds: an isolated
    beep must not trigger. It is NOT a replacement for a real smoke detector: it is a redundancy that listens to
    an existing detector.'
  fire_alarm: 'Fire alarm (building siren for example). Close to “Smoke detector”: choose only one as the main alert,
    the other as confirmation.'
  whistle: 'Whistle: can detect a whistling kettle, but is confused with mouth whistling.'
  steam_whistle: 'Steam whistle: kettle or pressure cooker. To be tested.'
  air_conditioning: 'Air conditioning: continuous noise. Mostly useful to understand why a microphone picks up constant
    background noise.'
  hammer_shared: 'Tools and works: rather neighbourhood noise than useful events.'
  explosion: 'Explosion: broad parent class of detonations. Loud and not very specific.'
  gunshot_gunfire: 'Gunshot: never trigger a heavy automatic action on this class alone. In regions where firecrackers
    or fireworks are common, expect many false alerts.'
  fireworks: 'Fireworks: use as context to raise the thresholds of “Gunshot”, “Explosion” and “Burst or pop” during
    festivities.'
  firecracker: 'Firecracker: same as “Fireworks”; frequently confused with a gunshot.'
  glass: 'Parent class of “Shattering glass” and “Glass clink”: choose “Shattering glass” instead.'
  chink_clink: 'Glass clink: meals, glasses clinking together. Very frequent, of little use.'
  shatter: 'Shattering glass: useful for security (broken window). Confirm with a window sensor or a camera: dropped
    dishes are frequent.'
  liquid: 'Broad parent class: do not select directly.'
  drip: 'Drip: can signal a tap or a leak, provided the microphone is close and the environment is quiet.'
  gush: 'Gush: possible hint of a major leak. Detects the noise, not the leak: pair it with a water sensor.'
  fill_with_liquid: 'Filling: useful for a bathtub or a bucket being filled. Combine with a duration (for example
    more than 10 minutes).'
  boiling: 'Boiling: can signal a pot or a kettle boiling. Does not replace a stove safety device.'
  thump_thud: 'Thud: a falling object or person, furniture, neighbours. Do not use alone for fall detection.'
  breaking: 'Breaking in general (not only glass): broader, therefore more false alerts.'
  beep_bleep: Appliance beeps (end of cycle). Very common, so group with “Microwave oven”; do not make it a fire
    alert.
  ding: 'Ding: confused with the doorbell and timers.'
  clatter: Clatter of objects falling or knocking together.
  sizzle: 'Sizzle: pan cooking. Detects a cooking noise, not a danger.'
  silence: 'Silence: if this class is constant while there is activity, the microphone is probably muted or badly
    connected.'
  inside_small_room_shared: 'Describes the acoustics of the place (room, outdoors) rather than an event: useful
    only to understand the microphone''s environment.'
  static_shared: 'Microphone quality indicator: a constantly high value often signals a noisy or saturated microphone.'
  mains_hum: 'Mains hum (50/60 Hz): if permanently high, the microphone picks up electrical noise (power supply,
    ground loop). Fix on the wiring side.'
  television: Television is the first cause of false alerts. As a CONTEXT class, it raises the thresholds of screams,
    gunshots, barks and doorbells while it is on.
  radio: 'Same use as “Television”: signals that a sound comes from a loudspeaker, not from the room.'
