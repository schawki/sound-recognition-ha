name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in the manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import json; print(json.load(open('custom_components/sound_recognition/manifest.json'))['version'])")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match manifest version $version"
            exit 1
          fi
      - name: Create the release (skipped if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
