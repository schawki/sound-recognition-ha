meta:
  catalogue: Catalogue des classes de sons (YAMNet / AudioSet) pour l'intégration de reconnaissance de sons
  version_schema: 1
  modele: YAMNet (521 classes)
  nb_classes: 521
  avertissement: 'Les champs interet, faux_positifs, seuil, duree_min_s, rearmement_s, tampon_*, conservation_clip_jours,
    usages, groupes, role et note sont des SUGGESTIONS DE DÉPART issues d''un jugement général sur ces sons ; rien
    n''a été mesuré dans une maison réelle. Les scores de YAMNet ne sont pas des probabilités calibrées : ajustez
    les seuils sur vos propres enregistrements. Les champs parents, ancetres_yamnet et descendants_yamnet viennent
    directement de l''ontologie AudioSet et sont fiables.'
  sources: ['https://github.com/tensorflow/models/tree/master/research/audioset/yamnet (yamnet_class_map.csv)',
    'https://github.com/audioset/ontology (ontology.json)']
  legende:
    interet: {surveiller: classe recommandée comme alerte pour une maison, optionnel: classe utile selon votre situation
        ; à activer en connaissance de cause, contexte: 'ne sert pas d''alerte : sert à relever les seuils des autres
        classes (télévision, musique, parole…)', ignorer: peu utile ou trop peu fiable pour une maison ; désactivée
        par défaut}
    role: {evenement: un événement que l'on peut signaler, contexte: 'décrit l''ambiance (télévision, foule, vent…)
        plutôt qu''un événement', diagnostic: 'indique l''état du micro (ronflement du secteur, vent, distorsion…)',
      generique: 'classe parente large : choisir plutôt ses sous-classes'}
    type_son: {impulsif: 'bref (verre qui casse, coup à la porte)', repete: 'se répète (pleurs, pas, bips)', tonal: 'ton
        soutenu (sirène, détecteur de fumée, sonnette)', continu: 'dure longtemps (eau qui coule, moteur, pluie)',
      variable: durée très variable}
    suggestions: {seuil: 'score minimum (0 à 1) à partir duquel la détection compte ; à ajuster, les scores de YAMNet
        ne sont pas calibrés', duree_min_s: durée minimale de détection soutenue avant de signaler, rearmement_s: délai
        avant de pouvoir signaler à nouveau le même son, tampon_avant_s: secondes d'audio conservées avant le déclenchement
        dans un clip, tampon_apres_s: secondes d'audio conservées après le déclenchement, conservation_clip_jours: durée
        de conservation des clips ; 0 = aucun clip}
    faux_positifs.niveau: {faible: rarement déclenchée à tort, moyen: parfois, eleve: 'souvent (télévision, voisinage…)'}
    vie_privee: {normale: pas de souci particulier, sensible: peut révéler des informations personnelles ; clips
        à garder très courts, confidentielle: 'conversations : aucun clip ne doit être conservé (clip_interdit =
        true)'}
categories: {voix: Voix humaine, corps: Corps et activités, foule: Foule et groupes, animaux_domestiques: Animaux
    domestiques, animaux_ferme: Animaux de ferme, animaux_sauvages: 'Animaux sauvages, oiseaux, insectes', musique: Musique,
  alarmes: 'Alarmes, sonnettes et signaux', nature: 'Vent, orage et feu', eau: Eau et liquides, vehicules: Véhicules
    et moteurs, maison: Sons de la maison, outils_mecanismes: Outils et mécanismes, impacts_explosions: 'Chocs,
    casse et détonations', onomatopees: Sons génériques (onomatopées), bruit_ambiance: 'Bruit, acoustique et diagnostic
    du micro', reproduction: 'Sons reproduits (télévision, radio)', divers: Divers}
groupes:
- id: chiens
  nom: Chiens
  membres: [Dog, Bark, Yip, Howl, Bow-wow, Growling, Whimper (dog), 'Canidae, dogs, wolves']
  risque: '« Chien » contient « Aboiement », « Jappement », « Ouaf », « Grondement », « Hurlement » et « Gémissement
    de chien » : un aboiement active souvent « Chien » en même temps. « Canidés » (chiens et loups) ne contient
    que « Grondement » et « Hurlement ».'
  conseil: Surveiller « Aboiement » seul. Ajouter « Hurlement de chien ou de loup » seulement si les hurlements
    vous intéressent.
- id: chats
  nom: Chats
  membres: [Cat, Meow, Purr, Hiss, Caterwaul]
  risque: « Chat » englobe les autres. Les miaulements stridents ressemblent à des pleurs de bébé.
  conseil: Choisir « Miaulement » seul ; ne pas combiner avec une alerte « pleurs de bébé » sans règle de confirmation.
- id: pleurs_cris_aigus
  nom: Pleurs et cris aigus
  membres: ['Baby cry, infant cry', 'Crying, sobbing', Whimper, 'Wail, moan', Meow, Caterwaul, Screaming, Squeal]
  risque: Sons aigus et plaintifs qui se confondent entre eux (bébé, chat, cri humain, grincement).
  conseil: 'Si vous surveillez un bébé : « Pleurs de bébé » avec au moins 2 secondes de détection continue ; ignorez
    les autres.'
- id: cris
  nom: Cris et appels
  membres: [Shout, Yell, Screaming, Bellow, Whoop, Children shouting, Children playing, Cheering, Crowd]
  risque: Les enfants qui jouent, les matchs à la télévision et les films déclenchent souvent ces classes.
  conseil: Garder « Hurlements stridents » (et éventuellement « Cri ») avec un seuil élevé ; utiliser « Télévision
    » comme contexte.
- id: parole
  nom: Parole, voix et contexte vocal
  membres: [Speech, Conversation, 'Child speech, kid speaking', 'Narration, monologue', Babbling, Whispering, Chatter,
    'Hubbub, speech noise, speech babble', Speech synthesizer, Television, Radio]
  risque: 'Vie privée : ces classes détectent des conversations. Se confondent avec la télévision et la radio.'
  conseil: Ne jamais conserver de clip. Les utiliser comme contexte (« quelqu'un parle ») plutôt que comme alerte.
- id: voix_chantee
  nom: Voix chantée, psalmodie et prière diffusée
  membres: [Singing, Chant, Mantra, Choir, Vocal music, Middle Eastern music, Humming, Child singing, Synthetic
      singing, Speech]
  risque: Une voix chantée ou psalmodiée diffusée par haut-parleur (appel à la prière, annonces) active plusieurs
    de ces classes, ainsi que « Parole ».
  conseil: Ne pas en faire des alertes. Si ces sons sont fréquents chez vous, relever les seuils des autres classes
    vocales à ces moments.
- id: detonations
  nom: Détonations et chocs secs
  membres: ['Gunshot, gunfire', Machine gun, Fusillade, Artillery fire, Cap gun, Fireworks, Firecracker, Explosion,
    Boom, Bang, 'Burst, pop', Slam, 'Thump, thud', Thunk, Thunder]
  risque: Pétards, feux d'artifice, portes qui claquent et tonnerre sont facilement pris pour un coup de feu.
  conseil: Ne jamais déclencher d'action lourde sur ces classes seules. Utiliser « Feux d'artifice » et « Pétard
    » comme contexte inhibiteur.
- id: casse_verre
  nom: Verre et casse
  membres: [Glass, Shatter, 'Chink, clink', Breaking, 'Smash, crash', 'Dishes, pots, and pans', 'Cutlery, silverware',
    Clatter]
  risque: La vaisselle qui tombe ou s'entrechoque ressemble à un verre brisé.
  conseil: Garder « Verre brisé » seul pour la sécurité ; « Casse » et « Fracas » en option. Confirmer avec un capteur
    d'ouverture ou une caméra.
- id: bips_incendie
  nom: Alarmes incendie et bips d'appareils
  membres: ['Smoke detector, smoke alarm', Fire alarm, Alarm, Buzzer, 'Beep, bleep', Microwave oven, Reversing beeps,
    Alarm clock]
  risque: Un bip isolé de micro-ondes ou de lave-linge peut ressembler à un détecteur de fumée.
  conseil: 'Pour l''alerte incendie : « Détecteur de fumée » et « Alarme incendie » avec au moins 3 secondes de
    détection soutenue. Ne pas ajouter « Bip » comme alerte.'
- id: sonnettes_cloches
  nom: Sonnettes, sonneries et cloches
  membres: [Doorbell, Ding-dong, Ding, Ping, Bell, Church bell, Chime, Wind chime, Jingle bell, Bicycle bell, Telephone
      bell ringing, Ringtone, Telephone, 'Jingle, tinkle', Tuning fork]
  risque: Les sonneries de téléphone, de télévision et les cloches sont proches d'une sonnette de porte.
  conseil: 'Pour la porte : « Sonnette de porte » seul. Les sonneries de téléphone et les cloches restent hors alerte.'
- id: sirenes
  nom: Sirènes et avertisseurs
  membres: [Siren, Police car (siren), Ambulance (siren), 'Fire engine, fire truck (siren)', Emergency vehicle,
    Civil defense siren, Car alarm, 'Vehicle horn, car horn, honking', Toot, 'Air horn, truck horn', Foghorn]
  risque: Sons de rue très fréquents, qui se confondent entre eux et avec la télévision.
  conseil: Utile seulement comme indicateur extérieur ; ne pas déclencher d'alerte maison.
- id: sifflets
  nom: Sifflets
  membres: [Whistle, Steam whistle, Whistling, Train whistle, Hiss, Steam]
  risque: Une bouilloire à sifflet, un sifflement de bouche ou une fuite de vapeur sont proches.
  conseil: À tester avec votre cuisine avant d'en faire une automatisation.
- id: portes_coups
  nom: Portes, coups et frappes
  membres: [Knock, Door, Slam, Tap, Sliding door, 'Thump, thud', Thunk, Bang, Cupboard open or close, Drawer open
      or close, Squeak]
  risque: Coups à la porte, tiroirs et meubles se confondent. « Porte » englobe plusieurs sons.
  conseil: Choisir « Coups à la porte » pour une visite, « Claquement de porte » pour les claquements ; éviter «
    Porte » et « Tapotement ».
- id: eau_coule
  nom: Eau qui coule, fuites
  membres: ['Water tap, faucet', Sink (filling or washing), Bathtub (filling or washing), Pour, 'Trickle, dribble',
    Gush, Fill (with liquid), Drip, 'Splash, splatter', Stream, Toilet flush, Rain, Rain on surface, Raindrop, Boiling,
    White noise]
  risque: 'Un robinet, la douche, la pluie et le bruit blanc se ressemblent. Aucune de ces classes ne détecte l''eau
    : seulement son bruit.'
  conseil: Toujours accompagner d'une durée et d'un vrai capteur d'eau pour les fuites.
- id: moteurs_continus
  nom: Moteurs et appareils continus
  membres: [Vacuum cleaner, Hair dryer, Blender, Mechanical fan, Air conditioning, Engine, Light engine (high frequency),
    Medium engine (mid frequency), Heavy engine (low frequency), Idling, Lawn mower, Power tool, Drill, White noise,
    Pink noise, Noise, Environmental noise, Whir, Hum]
  risque: Bruits continus qui se confondent entre eux et masquent les autres sons.
  conseil: 'Les traiter comme contexte : ils indiquent surtout pourquoi les autres classes sont moins sensibles.'
- id: pas_presence
  nom: Pas et présence
  membres: ['Walk, footsteps', Run, Shuffle, Patter, Typing, Computer keyboard, Keys jangling, Finger snapping,
    Clapping]
  risque: Un capteur de présence fait mieux. Les pas dépendent du revêtement de sol, du micro et des voisins.
  conseil: À utiliser en complément d'un capteur de présence, pas à sa place.
- id: toux_souffle
  nom: Toux, éternuements et respiration
  membres: [Cough, Throat clearing, Sneeze, Sniff, Snort, Wheeze, Breathing, Snoring, Gasp, Pant, Sigh]
  risque: Sons proches entre eux ; ils relèvent de la santé donc sensibles.
  conseil: Ne pas conserver de clip. À réserver à des usages de présence discrète.
- id: insectes_rongeurs
  nom: Insectes et rongeurs
  membres: [Insect, Mosquito, 'Fly, housefly', Buzz, 'Bee, wasp, etc.', Cricket, Mouse, 'Rodents, rats, mice', Patter,
    Scratch]
  risque: Très faibles et très proches de bruits d'appareils ou de tuyauterie.
  conseil: Peu fiables ; à n'essayer qu'avec un micro proche (grenier, cave).
- id: oiseaux
  nom: Oiseaux
  membres: [Bird, 'Bird vocalization, bird call, bird song', 'Chirp, tweet', Squawk, 'Pigeon, dove', Coo, Crow,
    Caw, Owl, Hoot, 'Chicken, rooster', 'Crowing, cock-a-doodle-doo', 'Bird flight, flapping wings']
  risque: « Oiseau » englobe presque toutes les autres classes de ce groupe.
  conseil: Utile seulement comme indicateur d'ambiance extérieure.
- id: vehicules_rue
  nom: Véhicules dans la rue
  membres: [Vehicle, Motor vehicle (road), Car, Car passing by, Truck, Bus, Motorcycle, 'Traffic noise, roadway
      noise', Engine, Engine starting, Idling, 'Accelerating, revving, vroom', Skidding, Tire squeal]
  risque: Sons de rue omniprésents ; le micro près d'une fenêtre les capte en continu.
  conseil: Les utiliser comme contexte extérieur ; ignorer leurs événements.
- id: feu_crepitement
  nom: Feu, crépitement et cuisson
  membres: [Fire, Crackle, Frying (food), Sizzle, Rustling leaves, Rain on surface, Static]
  risque: Le feu, la friture, la pluie et les parasites se ressemblent beaucoup.
  conseil: Ne pas utiliser « Feu » comme alerte incendie. Se fier à un vrai détecteur de fumée.
- id: diagnostic_micro
  nom: Diagnostic de la qualité du micro
  membres: [Mains hum, Static, White noise, Pink noise, Distortion, Silence, Wind noise (microphone), Sidetone,
    Reverberation]
  risque: Ces classes ne décrivent pas un événement de la maison, mais l'état du micro et de son câblage.
  conseil: 'À surveiller pendant la mise en place : un « ronflement du secteur » constant, du vent ou de la distorsion
    indiquent un problème matériel.'
- id: musique_generale
  nom: Musique
  membres: [Music, Song, Background music, Theme music, Soundtrack music, Pop music, Singing, Television, Radio]
  risque: Une musique de fond active de nombreuses classes (voix, instruments, cloches).
  conseil: Garder « Musique » comme contexte ; ignorer instruments et genres.
regles_combinaison:
- id: incendie_double
  type: tous
  classes: ['Smoke detector, smoke alarm', Fire alarm]
  niveau: info
  message: '« Détecteur de fumée » et « Alarme incendie » sont très proches : un même événement peut déclencher
    les deux. Utilisez la même action pour les deux et ne comptez qu''une alerte (délai de ré-armement).'
- id: incendie_bips
  type: tous
  classes: ['Smoke detector, smoke alarm', 'Beep, bleep']
  niveau: attention
  message: '« Bip » se déclenche aussi sur micro-ondes et lave-linge : ne l''utilisez pas comme alerte incendie,
    et exigez une détection soutenue d''au moins 3 secondes pour « Détecteur de fumée ».'
- id: feu_seul
  type: un_parmi
  classes: [Fire, Crackle]
  niveau: attention
  message: '« Feu » et « Crépitement » se confondent avec la friture et la pluie : ne les utilisez pas comme alerte
    incendie.'
- id: detonations_feux
  type: un_parmi
  classes: ['Gunshot, gunfire', Explosion, Fireworks, Firecracker]
  niveau: attention
  message: Feux d'artifice et pétards se confondent avec des coups de feu. Utilisez « Feux d'artifice » et « Pétard
    » en contexte inhibiteur, pas comme événements, et ne déclenchez pas d'action lourde sur « Coup de feu » seul.
- id: sonnette_doublons
  type: un_parmi
  classes: [Doorbell, Ding-dong, Ding, Bell, Chime]
  niveau: attention
  message: Plusieurs classes de sonnette/cloche se déclenchent en même temps. Gardez « Sonnette de porte » comme
    alerte principale.
- id: sonnette_telephone
  type: un_parmi
  classes: [Doorbell, Telephone bell ringing, Ringtone]
  niveau: attention
  message: Les sonneries de téléphone peuvent déclencher « Sonnette de porte ». Mesurez les confusions chez vous
    avant d'automatiser.
- id: bebe_chat
  type: un_parmi
  classes: ['Baby cry, infant cry', Meow, Caterwaul]
  niveau: attention
  message: 'Les miaulements (surtout les cris de chats) sont parfois classés comme pleurs de bébé : exigez une détection
    soutenue d''au moins 2 secondes et un seuil adapté.'
- id: cris_multiples
  type: un_parmi
  classes: [Shout, Yell, Screaming, Children shouting]
  niveau: info
  message: 'Ces classes sont voisines : choisissez-en une comme alerte principale (par exemple « Hurlements stridents
    »). Les autres produiront des alertes en double.'
- id: verre_doublons
  type: un_parmi
  classes: [Glass, Shatter, Breaking, 'Smash, crash']
  niveau: info
  message: '« Verre » est le parent de « Verre brisé » : choisissez « Verre brisé » seul, et « Casse » ou « Fracas
    » en option avec un seuil plus élevé.'
- id: chiens_doublons
  type: un_parmi
  classes: [Dog, Bark, 'Canidae, dogs, wolves']
  niveau: info
  message: '« Chien » contient « Aboiement » (et « Jappement », « Ouaf », « Grondement », « Hurlement ») : un aboiement
    déclenche les deux. Gardez « Aboiement ». « Canidés » est redondant et plus bruyant.'
- id: parole_cible
  type: un_parmi
  classes: [Speech, Conversation, Whispering, 'Child speech, kid speaking']
  niveau: attention
  message: 'Classes de parole : elles détectent des conversations. Aucun clip ne doit être conservé ; utilisez-les
    seulement comme contexte.'
- id: eau_fuite
  type: un_parmi
  classes: ['Water tap, faucet', Gush, Drip, Fill (with liquid)]
  niveau: attention
  message: Ces classes détectent le bruit de l'eau, pas l'eau. Pour une fuite, ajoutez un vrai capteur d'eau et
    une durée minimale (par exemple 5 à 10 minutes).
- id: musique_classes
  type: un_parmi
  classes: [Music, Song, Singing, Vocal music, Pop music, Background music]
  niveau: info
  message: Quand la musique joue, de nombreuses classes (voix, instruments, cloches) s'activent. Surveillez « Musique
    » comme contexte plutôt que ses sous-classes.
- id: contexte_recommande
  type: un_parmi
  classes: [Screaming, 'Gunshot, gunfire', Bark, Doorbell, Shatter]
  niveau: info
  message: Ces classes sont sensibles à la télévision et à la radio. Ajoutez « Télévision » et « Radio » comme contexte
    pour relever automatiquement les seuils.
regles_automatiques:
- {id: parent_enfant, niveau: info, condition: une classe sélectionnée est un ancêtre (ancetres_yamnet / descendants_yamnet)
    d'une autre classe sélectionnée, message: '« {parent} » contient « {enfant} » : un même son déclenchera les
    deux. Gardez la plus précise, ou la plus large, mais pas les deux avec des règles différentes (rétention, seuil,
    action).'}
- {id: clip_interdit, niveau: danger, condition: conservation_clip_jours > 0 sur une classe dont clip_interdit vaut
    vrai, message: '« {classe} » détecte des conversations : aucun clip ne doit être conservé. La rétention est
    forcée à 0.'}
- {id: seuil_bas_fp_eleve, niveau: attention, condition: seuil inférieur au seuil suggéré sur une classe dont faux_positifs.niveau
    vaut « eleve », message: '« {classe} » est souvent déclenchée à tort ; un seuil aussi bas multipliera les fausses
    alertes. Ajoutez un contexte inhibiteur (télévision, radio, musique).'}
- {id: classe_generique, niveau: info, condition: role vaut « generique », message: '« {classe} » est une classe
    parente large : préférez ses sous-classes ({exemples}).'}
- {id: sans_contexte, niveau: info, condition: 'classe avec contextes_inhibiteurs non vide, sans aucune classe de
    contexte sélectionnée', message: '« {classe} » est sensible à la télévision, à la radio ou à la musique : sélectionnez-les
    comme classes de contexte pour relever automatiquement les seuils.'}
